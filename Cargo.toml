[package]
name = "unofficial-opencode-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Unofficial Rust client SDK for the OpenCode server HTTP and SSE APIs"
documentation = "https://docs.rs/unofficial-opencode-sdk"
readme = "README.md"
license = "MIT"
repository = "https://github.com/f4ah6o/unofficial-opencode-sdk-rs"
keywords = ["opencode", "sdk", "api", "sse", "client"]
categories = ["api-bindings", "web-programming::http-client"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/examples/**",
    "/tests/models.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/PUBLISHING.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[dependencies]
bytes = "1.10"
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
