[package]
name = "unofficial-opencode-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Unofficial Rust client SDK for the OpenCode server HTTP and SSE APIs"
documentation = "https://docs.rs/unofficial-opencode-sdk"
readme = "README.md"
license = "MIT"
repository = "https://github.com/f4ah6o/unofficial-opencode-sdk-rs"
keywords = ["opencode", "sdk", "api", "sse", "client"]
categories = ["api-bindings", "web-programming::http-client"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/examples/**",
    "/tests/models.rs",
    "/tests/current.rs",
    "/tests/v2.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/PUBLISHING.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[package.metadata.opencode]
upstream-version = "1.18.31"
official-sdk-version = "1.18.31"
upstream-commit = "ba341c6cac5ed1ef867ef127245a42b5e33d4946"
contract = "legacy-current+v2-preview"

[dependencies]
bytes = "1.10"
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
